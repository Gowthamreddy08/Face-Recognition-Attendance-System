<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Face Recognition Attendance</h1>
    <h2>Create Account</h2>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Create Account
        </button>

    </form>

    {% if error %}
        <p style="color:#ffb3b3; margin-top:15px; font-weight:bold;">
            {{ error }}
        </p>
    {% endif %}

    <br>

    <a href="{{ url_for('login') }}">
        <button type="button">
            Back to Login
        </button>
    </a>

    <div class="footer">
        Created by Gowtham Reddy
    </div>

</div>

</body>
</html>
