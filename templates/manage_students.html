<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Students</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container large-container">

    <h1>Manage Students</h1>

    {% if students %}

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Roll No</th>
            <th>Email</th>
            <th>Branch</th>
            <th>Year</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        {% for student in students %}

        <tr>

            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>{{ student[4] }}</td>
            <td>{{ student[5] }}</td>

            <td>

                <a href="{{ url_for('edit_student', student_id=student[0]) }}">
                    <button type="button">Edit</button>
                </a>

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

    {% else %}

    <p style="text-align:center;">No students found.</p>

    {% endif %}

    <br>

    <a href="{{ url_for('dashboard') }}">
        <button type="button">Back to Dashboard</button>
    </a>

</div>

</body>
</html>
