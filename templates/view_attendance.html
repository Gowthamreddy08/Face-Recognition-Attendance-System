=<!DOCTYPE html>
<html>
<head>
    <title>View Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container large-container">
    <h1>Attendance Report</h1>

    <form method="POST">
        <select name="month">
            {% for m in months %}
                <option value="{{m}}" {% if m == month %}selected{% endif %}>
                    {{m}}
                </option>
            {% endfor %}
        </select>

        <select name="year">
            {% for y in years %}
                <option value="{{y}}" {% if y == year %}selected{% endif %}>
                    {{y}}
                </option>
            {% endfor %}
        </select>

        <button type="submit">Check</button>
    </form>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Present</th>
                    <th>Total Working Days</th>
                    <th>Percentage</th>
                </tr>
            </thead>

            <tbody>
                {% for s in attendance %}
                <tr>
                    <td>{{ s[0] }}</td>
                    <td>{{ s[1] }}</td>
                    <td>{{ s[2] }}</td>
                    <td>{{ s[3] }}</td>
                    <td>{{ s[4] }}%</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <a href="/dashboard">
        <button type="button">Back</button>
    </a>

    <div class="footer">
        Created by Gowtham Reddy
    </div>
</div>

</body>
</html>
