<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Edit Student</h1>

    <form method="POST">

        <label>Student Name</label>
        <input
            type="text"
            name="name"
            value="{{ student[1] }}"
            required>

        <label>Roll Number</label>
        <input
            type="text"
            name="roll_no"
            value="{{ student[2] }}"
            required>

        <label>Email Address</label>
        <input
            type="email"
            name="email"
            value="{{ student[3] }}"
            required>

        <label>Branch</label>
        <input
            type="text"
            name="branch"
            value="{{ student[4] }}"
            required>

        <label>Year</label>
        <input
            type="text"
            name="year"
            value="{{ student[5] }}"
            required>

        <button
            type="submit"
            name="action"
            value="update">

            Update Student

        </button>

    </form>

    <br>

    <form method="POST"
          onsubmit="return confirm('Are you sure you want to delete this student? This action cannot be undone.');">

        <button
            type="submit"
            name="action"
            value="delete"
            style="background:#dc3545;color:white;">

            Delete Student

        </button>

    </form>

    <br>

    <a href="{{ url_for('manage_students') }}">
        <button type="button">Cancel</button>
    </a>

</div>

</body>
</html>
