<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Face Recognition Attendance</h1>
    <h2>Admin Login</h2>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}
        <p style="color:#ffb3b3; margin-top:15px; font-weight:bold;">
            {{ error }}
        </p>
    {% endif %}

    <br>

    <div style="margin-top:15px;">
    <a href="{{ url_for('signup') }}" style="text-decoration:none;">
        <button type="button">Create Admin Account</button>
    </a>
</div>

    <div class="footer">
        Created by Gowtham Reddy
    </div>

</div>

</body>
</html>
